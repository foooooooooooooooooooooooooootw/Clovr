apply plugin: 'com.android.application'

// Uncomment if you have a sentry.properties file on the build server:
// if (project.sentryMappingUploadingEnabled) {
//     apply plugin: 'io.sentry.android.gradle'
//     sentry { autoProguardConfig false }
// }

apply plugin: 'checkstyle'
task('checkstyle', type: Checkstyle) {
    configFile rootProject.file('checkstyle.xml')
    source 'src/main/java'
    ignoreFailures false
    showViolations true
    include '**/*.java'
    classpath = files()
}

afterEvaluate {
    tasks.findByName('check').dependsOn('checkstyle')
}

/**
 * Gets the short git commit hash for the build, or falls back gracefully.
 */
def getCommitHash = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception e) {
        return 'unknown'
    }
}

android {
    compileSdkVersion 34
    buildToolsVersion '34.0.0'
    namespace 'org.floens.chan'

    defaultConfig {
        applicationId "org.ftw.chan"  // differs from original so both can be installed
        minSdkVersion 21          // Drop Android < 5.0 (was 17 / Android 4.2)
        targetSdkVersion 34

        versionName "v3.1.1"
        versionCode 30101
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }


    /*
    To sign releases, create app/keys.properties with:
      keystoreFile=yourkey.store
      keystorePass=pass
      keyAlias=alias
      keyPass=pass
    */

    def hash = getCommitHash()

    File f = file('keys.properties')
    boolean doSign = f.exists()

    if (doSign) {
        Properties props = new Properties()
        InputStream is = new FileInputStream(f)
        props.load(is)

        signingConfigs {
            release {
                storeFile file(props['keystoreFile'])
                storePassword props['keystorePass']
                keyAlias props['keyAlias']
                keyPassword props['keyPass']
            }
        }

        is.close()
    }

    defaultPublishConfig "default"
    flavorDimensions "default"
    productFlavors {
        "default" {
            dimension "default"
            resValue "string", "app_name", "Clovr"
            resValue "string", "app_flavor_name", ""
            buildConfigField "String", "BUILD_HASH", "\"$hash\""
            // TODO: Replace with your own update endpoint
            buildConfigField "String", "UPDATE_API_ENDPOINT", "\"https://example.com/api/update\""
            // TODO: Replace with your own Sentry DSN or remove crash reporting
            buildConfigField "String", "CRASH_REPORT_TOKEN", "\"\""
        }

        dev {
            dimension "default"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Clovr dev"
            resValue "string", "app_flavor_name", ""
            buildConfigField "String", "BUILD_HASH", "\"$hash\""
            buildConfigField "String", "UPDATE_API_ENDPOINT", "\"https://example.com/api/update_dev\""
            buildConfigField "String", "CRASH_REPORT_TOKEN", "\"\""
            versionNameSuffix "-" + hash
        }

        fdroid {
            dimension "default"
            resValue "string", "app_name", "Clovr"
            resValue "string", "app_flavor_name", "F-Droid"
            buildConfigField "String", "BUILD_HASH", "\"$hash\""
            buildConfigField "String", "UPDATE_API_ENDPOINT", "\"https://example.com/api/update\""
            buildConfigField "String", "CRASH_REPORT_TOKEN", "\"\""
        }
    }

    buildTypes {
        release {
            if (doSign) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard.cfg'
            buildConfigField "boolean", "DEVELOPER_MODE", "false"
        }

        debug {
            buildConfigField "boolean", "DEVELOPER_MODE", "true"
        }
    }
    lint {
        abortOnError false
    }
}

dependencies {
    // AndroidX / Material
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.browser:browser:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Media3 (ExoPlayer rewrite) - replaces exoplayer2 2.11.7
    // Fixes codec issues, WebM/VP9/AV1, active maintenance
    implementation 'androidx.media3:media3-exoplayer:1.3.0'
    implementation 'androidx.media3:media3-ui:1.3.0'
    implementation 'androidx.media3:media3-datasource:1.3.0'

    // Networking
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Database
    implementation 'com.j256.ormlite:ormlite-core:5.7'
    implementation 'com.j256.ormlite:ormlite-android:5.7'

    // Parsing / UI
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.28'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0'
    implementation 'de.greenrobot:eventbus:2.4.0'
    implementation 'org.nibor.autolink:autolink:0.10.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'me.xdrop:fuzzywuzzy:1.4.0'
    implementation 'org.codejargon.feather:feather:1.0'

    // Sentry (optional - replace token in build flavors above before enabling)
    // implementation 'io.sentry:sentry-android:7.6.0'

    // Test
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.10.0'
}
